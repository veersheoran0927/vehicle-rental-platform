<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - RideEasy</title>

    <!-- Google Font: Sora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <!-- Navbar -->
    <header class="site-header">
        <nav class="navbar">
            <a href="index.html" class="logo">Ride<span>Easy</span></a>

            <!-- Menu button (shown only on phones) -->
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="menu-icon">&#9776;</label>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="browse.html">Browse Vehicles</a></li>
                <li><a href="my-bookings.html">My Bookings</a></li>
                <li><a href="login.html" class="login-btn">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="login-main">
        <div class="auth-card">
            <!-- Two hidden radio buttons decide which form is shown -->
            <input type="radio" name="auth-tab" id="tab-login" class="tab-radio" checked>
            <input type="radio" name="auth-tab" id="tab-register" class="tab-radio">

            <!-- Tabs (clicking a label selects its radio button) -->
            <div class="tabs">
                <label for="tab-login">Login</label>
                <label for="tab-register">Register</label>
            </div>

            <!-- Login form -->
            <section id="login" class="form-box">
                <h1>Welcome back</h1>
                <p class="form-sub">Log in to manage your bookings.</p>

                <form class="login-form" action="index.html">
                    <label for="login-email">Email</label>
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                        <input type="email" id="login-email" name="email" placeholder="you@example.com" required>
                    </div>

                    <label for="login-password">Password</label>
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                        <input type="password" id="login-password" name="password" placeholder="Your password" required>
                        <button type="button" class="show-pass" title="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>

                    <label for="role">Login As</label>
                    <select id="role" name="role">
                        <option value="customer">Customer</option>
                        <option value="admin">Admin</option>
                    </select>

                    <button type="submit">Login</button>
                </form>
                <p class="switch-text">Don't have an account? <label for="tab-register">Register here</label></p>
            </section>

            <!-- Register form -->
            <section id="register" class="form-box">
                <h1>Create account</h1>
                <p class="form-sub">It takes less than a minute.</p>

                <form class="register-form" action="login.html">
                    <label for="reg-name">Full Name</label>
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                        <input type="text" id="reg-name" name="name" placeholder="Your full name" required>
                    </div>

                    <label for="reg-email">Email</label>
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                        <input type="email" id="reg-email" name="email" placeholder="you@example.com" required>
                    </div>

                    <label for="reg-phone">Phone Number</label>
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
                        <input type="text" id="reg-phone" name="phone" inputmode="numeric" maxlength="10" placeholder="Enter mobile number" required>
                    </div>

                    <label for="reg-password">Password</label>
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                        <input type="password" id="reg-password" name="password" minlength="6" placeholder="At least 6 characters" required>
                        <button type="button" class="show-pass" title="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>

                    <label for="reg-confirm">Confirm Password</label>
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                        <input type="password" id="reg-confirm" name="confirm" minlength="6" placeholder="Type it again" required>
                    </div>

                    <button type="submit">Register</button>
                </form>
                <p class="switch-text">Already have an account? <label for="tab-login">Login here</label></p>
            </section>
        </div>
    </main>

</body>
</html>
