<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - RideEasy</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">RideEasy</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="browse.html">Browse Vehicles</a></li>
                <li><a href="my-bookings.html">My Bookings</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="login" class="form-box">
            <h1>Login</h1>
            <form class="login-form" action="index.html">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" name="email" required>

                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" required>

                <label for="role">Login As</label>
                <select id="role" name="role">
                    <option value="customer">Customer</option>
                    <option value="admin">Admin</option>
                </select>

                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="#register">Register here</a></p>
        </section>

        <section id="register" class="form-box">
            <h1>Register</h1>
            <form class="register-form" action="#login">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" name="name" required>

                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" name="email" required>

                <label for="reg-phone">Phone Number</label>
                <input type="text" id="reg-phone" name="phone" inputmode="numeric" maxlength="10" placeholder="Enter mobile number" required>

                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" name="password" minlength="6" required>

                <label for="reg-confirm">Confirm Password</label>
                <input type="password" id="reg-confirm" name="confirm" minlength="6" required>

                <button type="submit">Register</button>
            </form>
            <p>Already have an account? <a href="#login">Login here</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 RideEasy. All rights reserved.</p>
    </footer>

</body>

</html>
